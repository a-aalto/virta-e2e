[project]
name = "virta-e2e"
version = "0.1.0"
description = "E2E Data pipeline project"
readme = "README.md"
authors = [
    { name = "Antti Aalto", email = "antti.johannes.aalto@student.laurea.fi" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "ruff>=0.17.3",
]

[project.scripts]
virta-e2e = "virta_e2e:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
